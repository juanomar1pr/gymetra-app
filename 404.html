<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100c22">
  <title>404 — Gymetra</title>
  <style>
    :root {
      --ink: #100c22;
      --ink-2: #19132f;
      --paper: #fffdf8;
      --muted: #b8b0cf;
      --purple: #7c4dff;
      --blue: #2aa8ff;
      --pink: #ff4f91;
      --line: rgba(255,255,255,.13);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--paper);
      background: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 74% 19%, rgba(124,77,255,.21), transparent 27%),
        radial-gradient(circle at 23% 83%, rgba(42,168,255,.13), transparent 25%),
        linear-gradient(135deg, #0c091b 0%, #17102e 52%, #0c1228 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;
      opacity: .35;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: clamp(56px, 6.7vw, 108px) clamp(56px, 6.7vw, 108px);
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }

    .page::after {
      content: "";
      position: absolute;
      z-index: 20;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 140px rgba(0,0,0,.58);
    }

    .ambient {
      position: absolute;
      z-index: -1;
      border-radius: 50%;
      filter: blur(2px);
      pointer-events: none;
    }

    .ambient.one {
      width: clamp(330px, 44vw, 740px);
      aspect-ratio: 1;
      right: -12%;
      top: -31%;
      border: clamp(55px, 7vw, 110px) solid rgba(255,79,145,.12);
      box-shadow: 0 0 110px rgba(255,79,145,.08);
    }

    .ambient.two {
      width: clamp(270px, 35vw, 590px);
      aspect-ratio: 1;
      left: -15%;
      bottom: -33%;
      border: clamp(45px, 6vw, 95px) solid rgba(42,168,255,.12);
      box-shadow: 0 0 110px rgba(42,168,255,.09);
    }

    .shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100svh;
      padding: clamp(22px, 3.2vw, 54px) clamp(22px, 4.8vw, 78px) clamp(20px, 3vw, 44px);
    }

    .topbar,
    .footer {
      position: relative;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--paper);
      font-size: clamp(.82rem, 1vw, .96rem);
      font-weight: 750;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .brand-mark {
      position: relative;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 10px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, var(--purple), var(--blue));
      box-shadow: 0 8px 30px rgba(90,82,255,.35), inset 0 1px rgba(255,255,255,.45);
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 2px solid white;
      border-left-color: transparent;
      border-radius: 50%;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: clamp(.65rem, .75vw, .78rem);
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 16px var(--pink);
    }

    .hero {
      position: relative;
      z-index: 5;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 0;
      min-width: 0;
    }

    .composition {
      position: relative;
      display: grid;
      place-items: center;
      width: min(100%, 1260px);
      max-width: 100%;
      min-width: 0;
      padding-block: clamp(12px, 2vh, 28px);
    }

    .index {
      position: absolute;
      left: 0;
      top: 14%;
      display: grid;
      gap: 7px;
      color: #8f86a9;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .66rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .index::before {
      content: "";
      width: 1px;
      height: 72px;
      margin: 0 auto 8px;
      background: linear-gradient(var(--pink), transparent);
    }

    .score {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-width: 0;
      height: clamp(205px, 36vw, 510px);
      perspective: 1100px;
    }

    .number {
      --face: #fff;
      --side: #6d45db;
      position: relative;
      display: grid;
      place-items: center;
      width: .7em;
      color: var(--face);
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(13rem, 37vw, 33rem);
      font-weight: 900;
      line-height: .78;
      letter-spacing: -.075em;
      -webkit-text-stroke: clamp(1px, .16vw, 3px) rgba(255,255,255,.46);
      text-shadow:
        1px 1px 0 var(--side), 2px 2px 0 var(--side), 3px 3px 0 var(--side),
        4px 4px 0 var(--side), 5px 5px 0 var(--side), 6px 6px 0 var(--side),
        7px 7px 0 var(--side), 8px 8px 0 var(--side), 9px 9px 0 var(--side),
        10px 10px 0 var(--side), 11px 11px 0 var(--side), 12px 12px 0 var(--side),
        20px 28px 40px rgba(0,0,0,.52);
      transform: translateZ(0) rotateY(var(--ry)) translateY(var(--y));
      transform-style: preserve-3d;
    }

    .number::before {
      content: attr(data-number);
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: transparent;
      -webkit-text-stroke: 0;
      text-shadow: -7px -9px 12px rgba(255,255,255,.5);
      clip-path: inset(0 43% 42% 0);
    }

    .number::after {
      content: "";
      position: absolute;
      z-index: -2;
      left: 12%; right: -17%; bottom: -17%;
      height: 12%;
      border-radius: 50%;
      background: rgba(0,0,0,.62);
      filter: blur(16px);
      transform: rotateX(65deg);
    }

    .four-a {
      --face: #8c5cff;
      --side: #4525a2;
      --ry: -9deg;
      --y: -1%;
      z-index: 1;
    }

    .zero {
      --face: #ff5a99;
      --side: #a5235d;
      --ry: 0deg;
      --y: 3%;
      z-index: 2;
    }

    .four-b {
      --face: #32aaff;
      --side: #075dab;
      --ry: 9deg;
      --y: -1%;
      z-index: 1;
    }

    .message {
      position: relative;
      z-index: 8;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: clamp(22px, 5vw, 80px);
      width: min(78vw, 900px);
      margin-top: clamp(-22px, -2vw, -7px);
      padding-top: clamp(20px, 2vw, 30px);
      border-top: 1px solid rgba(255,255,255,.24);
    }

    .message::before {
      content: "";
      position: absolute;
      top: -2px;
      left: 0;
      width: 25%;
      height: 3px;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      box-shadow: 0 0 18px rgba(255,79,145,.55);
    }

    h1 {
      margin: 0;
      max-width: 660px;
      font-size: clamp(1.75rem, 3.5vw, 3.8rem);
      font-weight: 700;
      line-height: .98;
      letter-spacing: -.055em;
      text-wrap: balance;
    }

    h1 span {
      color: var(--pink);
      font-style: italic;
      font-weight: 640;
    }

    .detail {
      margin: 0 0 .28em;
      max-width: 290px;
      color: var(--muted);
      font-size: clamp(.82rem, 1vw, 1rem);
      line-height: 1.55;
    }

    .footer {
      color: #857d9d;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: clamp(.61rem, .7vw, .72rem);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .footer-line {
      flex: 1;
      height: 1px;
      margin: 0 20px;
      background: linear-gradient(90deg, rgba(255,255,255,.18), transparent);
    }

    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      color: #bcb4d1;
      background: rgba(255,255,255,.035);
    }

    .score-pill b {
      color: var(--paper);
      font-size: .85rem;
    }

    @media (max-width: 760px) {
      .shell { padding: 22px 18px 19px; }
      .status { font-size: 0; }
      .status span { display: none; }
      .status::after { content: "404"; font-size: .62rem; }
      .brand { font-size: .78rem; }
      .brand-mark { width: 28px; height: 28px; border-radius: 8px; }
      .score { height: clamp(185px, 60vw, 310px); }
      .number {
        font-size: clamp(9.8rem, 47vw, 15rem);
        text-shadow:
          1px 1px 0 var(--side), 2px 2px 0 var(--side), 3px 3px 0 var(--side),
          4px 4px 0 var(--side), 5px 5px 0 var(--side), 6px 6px 0 var(--side),
          7px 7px 0 var(--side), 8px 8px 0 var(--side), 13px 20px 28px rgba(0,0,0,.48);
      }
      .index { display: none; }
      .message {
        grid-template-columns: 1fr;
        gap: 13px;
        width: min(92vw, 560px);
      }
      h1 { font-size: clamp(1.65rem, 8vw, 2.6rem); }
      .detail { max-width: 390px; }
      .footer-line { margin-inline: 10px; }
      .footer > span:first-child { display: none; }
      .ambient.one { right: -43%; top: -14%; }
    }

    @media (max-width: 440px) {
      .composition { transform: translateY(-1.5vh); }
      .score { height: 46vw; min-height: 164px; }
      .number { font-size: clamp(9.4rem, 47vw, 12rem); }
      .message { margin-top: 8px; padding-top: 22px; }
      h1 { font-size: clamp(1.6rem, 8.1vw, 2.15rem); }
      .detail { font-size: .82rem; }
      .score-pill { padding: 7px 10px; }
      .footer { font-size: .56rem; }
    }

    @media (max-height: 690px) and (min-width: 700px) {
      .shell { padding-block: 20px; }
      .score { height: 44vh; }
      .number { font-size: 43vh; }
      .message { padding-top: 15px; }
      h1 { font-size: clamp(1.75rem, 5vh, 2.7rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page" aria-labelledby="error-title">
    <div class="ambient one" aria-hidden="true"></div>
    <div class="ambient two" aria-hidden="true"></div>

    <div class="shell">
      <header class="topbar">
        <div class="brand"><i class="brand-mark" aria-hidden="true"></i>Gymetra</div>
        <div class="status"><span>Competition system</span> / page unavailable</div>
      </header>

      <section class="hero">
        <div class="composition">
          <div class="index" aria-hidden="true">Error reference / 404</div>

          <div class="score" aria-label="Error 404">
            <span class="number four-a" data-number="4" aria-hidden="true">4</span>
            <span class="number zero" data-number="0" aria-hidden="true">0</span>
            <span class="number four-b" data-number="4" aria-hidden="true">4</span>
          </div>

          <div class="message">
            <h1 id="error-title">Oops! Looks like this page <span>took a tumble.</span></h1>
            <p class="detail">The page you're looking for doesn't exist or has been moved.</p>
          </div>
        </div>
      </section>

      <footer class="footer">
        <span>Precision in every score</span>
        <i class="footer-line" aria-hidden="true"></i>
        <span class="score-pill">Status <b>404.00</b></span>
      </footer>
    </div>
  </main>
</body>
</html>
